<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>噗伊大作战</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #menu {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 10;
      color: #fff;
    }
    #menu h1 {
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      margin-bottom: 1.5rem;
      text-shadow: 0 0 20px #e94560, 0 0 40px #e94560;
      letter-spacing: 0.15em;
    }
    .level-btn {
      display: block;
      width: min(280px, 80vw);
      padding: 14px 20px;
      margin: 8px 0;
      font-size: 1.15rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }
    .level-btn:hover, .level-btn:active {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
    }
    .level-btn.disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #game-container {
      position: absolute; inset: 0;
      display: none;
    }
    #gameCanvas {
      display: block;
      width: 100%; height: 100%;
      background: #0d1b2a;
    }
    #hud {
      position: absolute; top: 12px; left: 12px;
      color: #fff; font-size: 14px;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      z-index: 5;
    }
    #back-btn {
      position: absolute; top: 12px; right: 12px;
      padding: 8px 16px;
      background: rgba(233, 69, 96, 0.85);
      color: #fff; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer; z-index: 5;
    }
    #joystick-zone {
      position: absolute;
      width: 140px; height: 140px;
      z-index: 5;
      display: none;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    #joystick-base {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      position: relative;
    }
    #joystick-knob {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.9);
      position: absolute;
      left: 42px; top: 42px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #win-overlay, #lose-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.7);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; color: #fff;
    }
    #win-overlay h2, #lose-overlay h2 { font-size: 2rem; margin-bottom: 1rem; }
    .overlay-btn {
      padding: 12px 28px; margin: 8px;
      font-size: 1.1rem; border: none; border-radius: 10px;
      background: #e94560; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>噗伊大作战</h1>
    <button class="level-btn" data-level="1">第一关</button>
    <button class="level-btn disabled" data-level="2">第二关</button>
    <button class="level-btn disabled" data-level="3">第三关</button>
    <button class="level-btn disabled" data-level="4">第四关</button>
    <button class="level-btn disabled" data-level="5">第五关</button>
    <button class="level-btn disabled" data-level="endless">无尽模式</button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">质量: <span id="mass-display">10</span> | 目标: 500</div>
    <button id="back-btn">返回主页</button>
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="win-overlay">
      <h2>通关成功！</h2>
      <p>噗伊已经足够大啦～</p>
      <button class="overlay-btn" id="next-level-btn">返回主页</button>
    </div>
    <div id="lose-overlay">
      <h2>被抓到了</h2>
      <button class="overlay-btn" id="retry-btn">再试一次</button>
      <button class="overlay-btn" id="menu-btn">返回主页</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      winMass: 500,
      foodCount: 280,
      botCount: 30,
      worldSize: 6000,
      playerStartMass: 10,
      foodMass: 1.5,
      maxSpeed: 4.5,
      playerSpeedMul: 0.5,
      botSpeedMul: 0.25,
      accel: 0.35,
      frictionTime: 0.3,
      eatAnimDuration: 100,
      imgPuyi: 'photo/puyi.png',
      imgEating: 'photo/puyi-eating.png',
      bgImage: 'photo/Story_2f_cocoon_B.webp',
      bgm: 'BGM/Passion_Red.ogg',
      monsterTypes: [
        { name: 'small',  mass: 6,  img: 'photo/xiaoguai2.png' },
        { name: 'medium', mass: 16, img: 'photo/xiaoguai3.png' },
        { name: 'large',  mass: 32, img: 'photo/xiaoguai4.png' }
      ]
    };

    const menu = document.getElementById('menu');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const massDisplay = document.getElementById('mass-display');
    const backBtn = document.getElementById('back-btn');
    const joystickZone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    const winOverlay = document.getElementById('win-overlay');
    const loseOverlay = document.getElementById('lose-overlay');

    let running = false;
    let player, foods, bots;
    let camera = { x: 0, y: 0, scale: 1 };
    let mouse = { x: 0, y: 0, down: false };
    let joy = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };
    let images = { puyi: null, eating: null, monsters: {}, bg: null };
    let bgmAudio = null;
    let lastTime = 0;
    let isMobile = false;

    function massToRadius(m) { return Math.sqrt(m) * 6; }
    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function getCameraScale(mass) {
      const steps = Math.floor(mass / 50);
      let s = Math.max(0.28, 1 - steps * 0.09);
      if (isMobile) {
        s *= 0.58;
        s = Math.max(0.22, s);
      }
      return s;
    }

    function loadImages() {
      const promises = [
        new Promise(res => {
          const img = new Image();
          img.onload = () => { images.puyi = img; res(); };
          img.onerror = () => { images.puyi = null; res(); };
          img.src = CONFIG.imgPuyi;
        }),
        new Promise(res => {
          const img = new Image();
          img.onload = () => { images.eating = img; res(); };
          img.onerror = () => { images.eating = null; res(); };
          img.src = CONFIG.imgEating;
        }),
        new Promise(res => {
          const img = new Image();
          img.onload = () => { images.bg = img; res(); };
          img.onerror = () => { images.bg = null; res(); };
          img.src = CONFIG.bgImage;
        })
      ];
      CONFIG.monsterTypes.forEach(t => {
        promises.push(new Promise(res => {
          const img = new Image();
          img.onload = () => { images.monsters[t.name] = img; res(); };
          img.onerror = () => { images.monsters[t.name] = null; res(); };
          img.src = t.img;
        }));
      });
      return Promise.all(promises);
    }

    function initBgm() {
      bgmAudio = new Audio(CONFIG.bgm);
      bgmAudio.loop = true;
      bgmAudio.volume = 0.45;
    }
    function playBgm() {
      if (!bgmAudio) initBgm();
      bgmAudio.currentTime = 0;
      bgmAudio.play().catch(() => {});
    }
    function stopBgm() {
      if (bgmAudio) { bgmAudio.pause(); bgmAudio.currentTime = 0; }
    }

    class Ball {
      constructor(x, y, mass, isPlayer = false, monsterType = null) {
        this.x = x; this.y = y; this.mass = mass;
        this.vx = 0; this.vy = 0;
        this.isPlayer = isPlayer;
        this.monsterType = monsterType;
        this.eatTimer = 0; this.alive = true;
        this.speedMul = isPlayer ? CONFIG.playerSpeedMul : CONFIG.botSpeedMul;
        this.wanderAngle = Math.random() * Math.PI * 2;
        this.wanderTimer = 0;
      }
      get r() { return massToRadius(this.mass); }

      update(dt, targetDx, targetDy, isMoving) {
        if (!this.alive) return;
        const baseMax = CONFIG.maxSpeed * this.speedMul;
        const maxSpd = baseMax * (1 + Math.log10(this.mass + 1) * 0.15);
        if (isMoving) {
          const len = Math.sqrt(targetDx * targetDx + targetDy * targetDy) || 1;
          this.vx += (targetDx / len) * CONFIG.accel * this.speedMul * 60 * dt;
          this.vy += (targetDy / len) * CONFIG.accel * this.speedMul * 60 * dt;
          const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (spd > maxSpd) {
            this.vx = (this.vx / spd) * maxSpd;
            this.vy = (this.vy / spd) * maxSpd;
          }
        } else {
          const friction = Math.pow(0.01, dt / CONFIG.frictionTime);
          this.vx *= friction; this.vy *= friction;
          if (Math.abs(this.vx) < 0.01) this.vx = 0;
          if (Math.abs(this.vy) < 0.01) this.vy = 0;
        }
        this.x += this.vx; this.y += this.vy;
        const r = this.r;
        this.x = clamp(this.x, r, CONFIG.worldSize - r);
        this.y = clamp(this.y, r, CONFIG.worldSize - r);
        if (this.eatTimer > 0) this.eatTimer -= dt * 1000;
      }

      draw(ctx, sx, sy, scale) {
        if (!this.alive) return;
        const r = this.r * scale;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        if (this.isPlayer && images.puyi) {
          const img = (this.eatTimer > 0 && images.eating) ? images.eating : images.puyi;
          ctx.drawImage(img, sx - r, sy - r, r * 2, r * 2);
        } else if (this.monsterType && images.monsters[this.monsterType]) {
          ctx.drawImage(images.monsters[this.monsterType], sx - r, sy - r, r * 2, r * 2);
        } else {
          ctx.fillStyle = this.monsterType === 'large' ? '#e74c3c' :
                          this.monsterType === 'medium' ? '#f39c12' : '#2ecc71';
          ctx.fill();
        }
        ctx.restore();
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 2 * scale;
        ctx.stroke();
      }
    }

    function initLevel(level) {
      foods = []; bots = [];
      const cx = CONFIG.worldSize / 2, cy = CONFIG.worldSize / 2;
      player = new Ball(cx, cy, CONFIG.playerStartMass, true);

      for (let i = 0; i < CONFIG.foodCount; i++) {
        foods.push({
          x: Math.random() * CONFIG.worldSize,
          y: Math.random() * CONFIG.worldSize,
          mass: CONFIG.foodMass,
          color: `hsl(${Math.random()*360}, 80%, 60%)`
        });
      }

      for (let i = 0; i < CONFIG.botCount; i++) {
        let bx, by, tries = 0;
        do {
          bx = Math.random() * CONFIG.worldSize;
          by = Math.random() * CONFIG.worldSize;
          tries++;
        } while (dist({x:bx,y:by}, player) < 300 && tries < 60);
        const type = CONFIG.monsterTypes[i % 3];
        bots.push(new Ball(bx, by, type.mass, false, type.name));
      }

      camera.scale = getCameraScale(CONFIG.playerStartMass);
      camera.x = player.x; camera.y = player.y;
      winOverlay.style.display = 'none';
      loseOverlay.style.display = 'none';
      massDisplay.textContent = Math.floor(player.mass);
      joystickZone.style.display = 'none';
    }

    function setupInput() {
      isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                 ('ontouchstart' in window && window.innerWidth < 900);

      if (isMobile) {
        const maxR = 50;
        const handleStart = (e) => {
          if (e.target === backBtn || backBtn.contains(e.target)) return;
          e.preventDefault();
          const t = e.touches[0];
          joy.active = true;
          joy.originX = t.clientX;
          joy.originY = t.clientY;
          joy.dx = 0; joy.dy = 0;
          joystickZone.style.display = 'block';
          joystickZone.style.left = t.clientX + 'px';
          joystickZone.style.top = t.clientY + 'px';
          knob.style.left = '42px';
          knob.style.top = '42px';
        };
        const handleMove = (e) => {
          if (!joy.active) return;
          e.preventDefault();
          const t = e.touches[0];
          let dx = t.clientX - joy.originX;
          let dy = t.clientY - joy.originY;
          const len = Math.sqrt(dx*dx + dy*dy);
          if (len > maxR) {
            dx = dx / len * maxR;
            dy = dy / len * maxR;
          }
          joy.dx = dx / maxR;
          joy.dy = dy / maxR;
          knob.style.left = (42 + dx) + 'px';
          knob.style.top = (42 + dy) + 'px';
        };
        const handleEnd = () => {
          joy.active = false;
          joy.dx = 0; joy.dy = 0;
          joystickZone.style.display = 'none';
        };
        canvas.addEventListener('touchstart', handleStart, {passive:false});
        canvas.addEventListener('touchmove', handleMove, {passive:false});
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('touchcancel', handleEnd);
      } else {
        canvas.addEventListener('mousemove', e => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', e => {
          if (e.button === 0) mouse.down = true;
        });
        window.addEventListener('mouseup', e => {
          if (e.button === 0) mouse.down = false;
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());
      }
    }

    function update(dt) {
      if (!running || !player.alive) return;

      let tDx = 0, tDy = 0, moving = false;
      if (isMobile) {
        if (joy.active && (Math.abs(joy.dx) > 0.05 || Math.abs(joy.dy) > 0.05)) {
          tDx = joy.dx; tDy = joy.dy; moving = true;
        }
      } else {
        tDx = mouse.x - canvas.width / 2;
        tDy = mouse.y - canvas.height / 2;
        moving = mouse.down;
      }

      player.update(dt, tDx, tDy, moving);

      bots.forEach(bot => {
        if (!bot.alive) return;
        let dx, dy;
        // 比玩家大：追击；比玩家小或差不多：不逃跑，只在地图上随机游走
        if (bot.mass > player.mass * 1.15 && dist(bot, player) < 600) {
          dx = player.x - bot.x;
          dy = player.y - bot.y;
        } else {
          // 随机游走：缓慢改变方向，避免挤在角落
          if (bot.wanderTimer === undefined) bot.wanderTimer = 0;
          if (bot.wanderAngle === undefined) bot.wanderAngle = Math.random() * Math.PI * 2;
          bot.wanderTimer -= dt;
          if (bot.wanderTimer <= 0) {
            bot.wanderAngle += (Math.random() - 0.5) * 1.8;
            bot.wanderTimer = 1.2 + Math.random() * 2.5;
          }
          // 靠近边界时转向地图内侧，防止贴边
          const margin = 200;
          if (bot.x < margin) bot.wanderAngle = 0 + (Math.random() - 0.5) * 0.8;
          else if (bot.x > CONFIG.worldSize - margin) bot.wanderAngle = Math.PI + (Math.random() - 0.5) * 0.8;
          if (bot.y < margin) bot.wanderAngle = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
          else if (bot.y > CONFIG.worldSize - margin) bot.wanderAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
          dx = Math.cos(bot.wanderAngle) * 60;
          dy = Math.sin(bot.wanderAngle) * 60;
        }
        bot.update(dt, dx, dy, true);
      });

      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        if (dist(player, f) < player.r - 2) {
          player.mass += f.mass;
          player.eatTimer = CONFIG.eatAnimDuration;
          foods.splice(i, 1);
          foods.push({
            x: Math.random() * CONFIG.worldSize,
            y: Math.random() * CONFIG.worldSize,
            mass: CONFIG.foodMass,
            color: `hsl(${Math.random()*360}, 80%, 60%)`
          });
        }
      }

      for (let i = 0; i < bots.length; i++) {
        const bot = bots[i];
        if (!bot.alive || !player.alive) continue;
        const d = dist(player, bot);
        if (d < Math.max(player.r, bot.r) * 0.85) {
          if (player.mass > bot.mass * 1.12) {
            player.mass += bot.mass * 0.9;
            bot.alive = false;
            player.eatTimer = CONFIG.eatAnimDuration;
          } else if (bot.mass > player.mass * 1.12) {
            player.alive = false;
          }
        }
      }

      camera.scale = getCameraScale(player.mass);
      camera.x = player.x; camera.y = player.y;
      massDisplay.textContent = Math.floor(player.mass);

      if (player.mass >= CONFIG.winMass) {
        running = false; stopBgm();
        winOverlay.style.display = 'flex';
      }
      if (!player.alive) {
        running = false; stopBgm();
        loseOverlay.style.display = 'flex';
      }
    }

    function worldToScreen(wx, wy) {
      const s = camera.scale;
      return {
        x: (wx - camera.x) * s + canvas.width / 2,
        y: (wy - camera.y) * s + canvas.height / 2
      };
    }

    function drawBackground() {
      if (!images.bg) {
        ctx.fillStyle = '#0d1b2a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }
      const img = images.bg;
      const cw = canvas.width, ch = canvas.height;
      const ir = img.width / img.height;
      const cr = cw / ch;
      let dw, dh, dx, dy;
      if (cr > ir) {
        dw = cw; dh = cw / ir;
        dx = 0; dy = (ch - dh) / 2;
      } else {
        dh = ch; dw = ch * ir;
        dx = (cw - dw) / 2; dy = 0;
      }
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.fillStyle = 'rgba(10, 20, 35, 0.4)';
      ctx.fillRect(0, 0, cw, ch);
    }

    function draw() {
      drawBackground();
      const s = camera.scale;

      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      const grid = 100;
      const viewW = canvas.width / s, viewH = canvas.height / s;
      const startGX = Math.floor((camera.x - viewW / 2) / grid) * grid;
      const startGY = Math.floor((camera.y - viewH / 2) / grid) * grid;
      for (let x = startGX; x < camera.x + viewW / 2 + grid; x += grid) {
        const p1 = worldToScreen(x, camera.y - viewH / 2);
        const p2 = worldToScreen(x, camera.y + viewH / 2);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      for (let y = startGY; y < camera.y + viewH / 2 + grid; y += grid) {
        const p1 = worldToScreen(camera.x - viewW / 2, y);
        const p2 = worldToScreen(camera.x + viewW / 2, y);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }

      foods.forEach(f => {
        const p = worldToScreen(f.x, f.y);
        if (p.x < -20 || p.x > canvas.width + 20 || p.y < -20 || p.y > canvas.height + 20) return;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5 * s, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      });

      bots.forEach(b => {
        const p = worldToScreen(b.x, b.y);
        b.draw(ctx, p.x, p.y, s);
      });
      if (player) {
        const p = worldToScreen(player.x, player.y);
        player.draw(ctx, p.x, p.y, s);
      }
    }

    function loop(ts) {
      if (!running) return;
      const dt = Math.min((ts - lastTime) / 1000, 0.05);
      lastTime = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function startGame(level) {
      menu.style.display = 'none';
      gameContainer.style.display = 'block';
      resize();
      initLevel(level);
      playBgm();
      running = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function backToMenu() {
      running = false;
      stopBgm();
      gameContainer.style.display = 'none';
      menu.style.display = 'flex';
      winOverlay.style.display = 'none';
      loseOverlay.style.display = 'none';
      joystickZone.style.display = 'none';
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('disabled')) return;
        if (btn.dataset.level === '1') startGame(1);
      });
    });

    backBtn.addEventListener('click', backToMenu);
    document.getElementById('next-level-btn').addEventListener('click', backToMenu);
    document.getElementById('retry-btn').addEventListener('click', () => {
      winOverlay.style.display = 'none';
      loseOverlay.style.display = 'none';
      initLevel(1);
      playBgm();
      running = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });
    document.getElementById('menu-btn').addEventListener('click', backToMenu);
    window.addEventListener('resize', () => { if (running) resize(); });

    setupInput();
    initBgm();
    loadImages().then(() => console.log('噗伊大作战 资源加载完成'));
  </script>
</body>
</html>
