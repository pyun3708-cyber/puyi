<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>噗伊大作战</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #menu {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 10;
      color: #fff;
    }
    #menu h1 {
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      margin-bottom: 1.5rem;
      text-shadow: 0 0 20px #e94560, 0 0 40px #e94560;
      letter-spacing: 0.15em;
    }
    .level-btn {
      display: block;
      width: min(280px, 80vw);
      padding: 14px 20px;
      margin: 8px 0;
      font-size: 1.15rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }
    .level-btn:hover, .level-btn:active {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
    }
    .level-btn.disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #game-container {
      position: absolute; inset: 0;
      display: none;
    }
    #gameCanvas {
      display: block;
      width: 100%; height: 100%;
      background: #0d1b2a;
    }
    #hud {
      position: absolute; top: 12px; left: 12px;
      color: #fff; font-size: 14px;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      z-index: 5;
    }
    #back-btn {
      position: absolute; top: 12px; right: 12px;
      padding: 8px 16px;
      background: rgba(233, 69, 96, 0.85);
      color: #fff; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer; z-index: 5;
    }
    /* Joystick */
    #joystick-zone {
      position: absolute;
      left: 20px; bottom: 20px;
      width: 140px; height: 140px;
      z-index: 5;
      display: none;
    }
    #joystick-base {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      position: relative;
    }
    #joystick-knob {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.9);
      position: absolute;
      left: 42px; top: 42px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #win-overlay, #lose-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.7);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20; color: #fff;
    }
    #win-overlay h2, #lose-overlay h2 { font-size: 2rem; margin-bottom: 1rem; }
    .overlay-btn {
      padding: 12px 28px; margin: 8px;
      font-size: 1.1rem; border: none; border-radius: 10px;
      background: #e94560; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>噗伊大作战</h1>
    <button class="level-btn" data-level="1">第一关</button>
    <button class="level-btn disabled" data-level="2">第二关</button>
    <button class="level-btn disabled" data-level="3">第三关</button>
    <button class="level-btn disabled" data-level="4">第四关</button>
    <button class="level-btn disabled" data-level="5">第五关</button>
    <button class="level-btn disabled" data-level="endless">无尽模式</button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">质量: <span id="mass-display">10</span> | 目标: 80</div>
    <button id="back-btn">返回主页</button>
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="win-overlay">
      <h2>通关成功！</h2>
      <p>噗伊已经足够大啦～</p>
      <button class="overlay-btn" id="next-level-btn">返回主页</button>
    </div>
    <div id="lose-overlay">
      <h2>被吃掉了…</h2>
      <button class="overlay-btn" id="retry-btn">再试一次</button>
      <button class="overlay-btn" id="menu-btn">返回主页</button>
    </div>
  </div>

  <script>
    // ============== 配置 ==============
    const CONFIG = {
      winMass: 80,
      foodCount: 80,
      botCount: 8,
      worldSize: 3000,
      playerStartMass: 10,
      foodMass: 1.5,
      maxSpeed: 4.5,
      accel: 0.35,
      frictionTime: 0.3, // 秒内减速停止
      eatAnimDuration: 100, // ms
      imgPuyi: 'photo/puyi.png',
      imgEating: 'photo/puyi-eating.png'
    };

    // ============== DOM ==============
    const menu = document.getElementById('menu');
    const gameContainer = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const massDisplay = document.getElementById('mass-display');
    const backBtn = document.getElementById('back-btn');
    const joystickZone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');
    const winOverlay = document.getElementById('win-overlay');
    const loseOverlay = document.getElementById('lose-overlay');

    // ============== 状态 ==============
    let running = false;
    let player, foods, bots;
    let camera = { x: 0, y: 0 };
    let mouse = { x: 0, y: 0, down: false };
    let joy = { active: false, dx: 0, dy: 0 };
    let images = { puyi: null, eating: null };
    let lastTime = 0;
    let isMobile = false;

    // ============== 工具函数 ==============
    function massToRadius(m) {
      return Math.sqrt(m) * 6;
    }

    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    // ============== 加载图片 ==============
    function loadImages() {
      return Promise.all([
        new Promise(res => {
          const img = new Image();
          img.onload = () => { images.puyi = img; res(); };
          img.onerror = () => { images.puyi = null; res(); };
          img.src = CONFIG.imgPuyi;
        }),
        new Promise(res => {
          const img = new Image();
          img.onload = () => { images.eating = img; res(); };
          img.onerror = () => { images.eating = null; res(); };
          img.src = CONFIG.imgEating;
        })
      ]);
    }

    // ============== 球类 ==============
    class Ball {
      constructor(x, y, mass, isPlayer = false, color = null) {
        this.x = x;
        this.y = y;
        this.mass = mass;
        this.vx = 0;
        this.vy = 0;
        this.isPlayer = isPlayer;
        this.color = color || `hsl(${Math.random()*360}, 70%, 55%)`;
        this.eatTimer = 0; // 进食动画剩余时间
        this.alive = true;
      }
      get r() { return massToRadius(this.mass); }

      update(dt, targetDx, targetDy, isMoving) {
        if (!this.alive) return;

        const maxSpd = CONFIG.maxSpeed * (1 + Math.log10(this.mass + 1) * 0.15);
        if (isMoving) {
          const len = Math.sqrt(targetDx * targetDx + targetDy * targetDy) || 1;
          const dirX = targetDx / len;
          const dirY = targetDy / len;
          this.vx += dirX * CONFIG.accel * 60 * dt;
          this.vy += dirY * CONFIG.accel * 60 * dt;
          const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (spd > maxSpd) {
            this.vx = (this.vx / spd) * maxSpd;
            this.vy = (this.vy / spd) * maxSpd;
          }
        } else {
          // 0.3 秒内减速停止
          const friction = Math.pow(0.01, dt / CONFIG.frictionTime);
          this.vx *= friction;
          this.vy *= friction;
          if (Math.abs(this.vx) < 0.01) this.vx = 0;
          if (Math.abs(this.vy) < 0.01) this.vy = 0;
        }

        this.x += this.vx;
        this.y += this.vy;

        // 边界
        const r = this.r;
        this.x = clamp(this.x, r, CONFIG.worldSize - r);
        this.y = clamp(this.y, r, CONFIG.worldSize - r);

        if (this.eatTimer > 0) this.eatTimer -= dt * 1000;
      }

      draw(ctx, camX, camY) {
        if (!this.alive) return;
        const sx = this.x - camX;
        const sy = this.y - camY;
        const r = this.r;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        if (this.isPlayer && images.puyi) {
          const img = (this.eatTimer > 0 && images.eating) ? images.eating : images.puyi;
          ctx.drawImage(img, sx - r, sy - r, r * 2, r * 2);
        } else {
          ctx.fillStyle = this.color;
          ctx.fill();
          // 简单眼睛
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(sx - r * 0.3, sy - r * 0.25, r * 0.22, 0, Math.PI * 2);
          ctx.arc(sx + r * 0.3, sy - r * 0.25, r * 0.22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.arc(sx - r * 0.3, sy - r * 0.25, r * 0.1, 0, Math.PI * 2);
          ctx.arc(sx + r * 0.3, sy - r * 0.25, r * 0.1, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 描边
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // ============== 初始化关卡 ==============
    function initLevel(level) {
      foods = [];
      bots = [];
      const cx = CONFIG.worldSize / 2;
      const cy = CONFIG.worldSize / 2;
      player = new Ball(cx, cy, CONFIG.playerStartMass, true);

      for (let i = 0; i < CONFIG.foodCount; i++) {
        foods.push({
          x: Math.random() * CONFIG.worldSize,
          y: Math.random() * CONFIG.worldSize,
          mass: CONFIG.foodMass,
          color: `hsl(${Math.random()*360}, 80%, 60%)`
        });
      }

      for (let i = 0; i < CONFIG.botCount; i++) {
        let bx, by, tries = 0;
        do {
          bx = Math.random() * CONFIG.worldSize;
          by = Math.random() * CONFIG.worldSize;
          tries++;
        } while (dist({x:bx,y:by}, player) < 200 && tries < 50);
        const m = 5 + Math.random() * 25;
        bots.push(new Ball(bx, by, m, false));
      }

      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;
      winOverlay.style.display = 'none';
      loseOverlay.style.display = 'none';
      massDisplay.textContent = Math.floor(player.mass);
    }

    // ============== 输入 ==============
    function setupInput() {
      isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                 ('ontouchstart' in window && window.innerWidth < 900);

      if (isMobile) {
        joystickZone.style.display = 'block';
        const base = document.getElementById('joystick-base');
        const baseRect = () => base.getBoundingClientRect();

        const handleStart = (e) => {
          e.preventDefault();
          joy.active = true;
          const t = e.touches ? e.touches[0] : e;
          updateJoy(t.clientX, t.clientY);
        };
        const handleMove = (e) => {
          if (!joy.active) return;
          e.preventDefault();
          const t = e.touches ? e.touches[0] : e;
          updateJoy(t.clientX, t.clientY);
        };
        const handleEnd = () => {
          joy.active = false;
          joy.dx = 0; joy.dy = 0;
          knob.style.left = '42px';
          knob.style.top = '42px';
        };

        function updateJoy(cx, cy) {
          const rect = baseRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          let dx = cx - centerX;
          let dy = cy - centerY;
          const maxR = 42;
          const len = Math.sqrt(dx*dx + dy*dy);
          if (len > maxR) {
            dx = dx / len * maxR;
            dy = dy / len * maxR;
          }
          joy.dx = dx / maxR;
          joy.dy = dy / maxR;
          knob.style.left = (42 + dx) + 'px';
          knob.style.top = (42 + dy) + 'px';
        }

        joystickZone.addEventListener('touchstart', handleStart, {passive:false});
        joystickZone.addEventListener('touchmove', handleMove, {passive:false});
        joystickZone.addEventListener('touchend', handleEnd);
        joystickZone.addEventListener('touchcancel', handleEnd);
      } else {
        // 电脑：鼠标位置决定方向，左键按住前进
        canvas.addEventListener('mousemove', e => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', e => {
          if (e.button === 0) mouse.down = true;
        });
        window.addEventListener('mouseup', e => {
          if (e.button === 0) mouse.down = false;
        });
        // 防止右键菜单
        canvas.addEventListener('contextmenu', e => e.preventDefault());
      }
    }

    // ============== 游戏循环 ==============
    function update(dt) {
      if (!running || !player.alive) return;

      let tDx = 0, tDy = 0, moving = false;

      if (isMobile) {
        if (joy.active && (Math.abs(joy.dx) > 0.05 || Math.abs(joy.dy) > 0.05)) {
          tDx = joy.dx;
          tDy = joy.dy;
          moving = true;
        }
      } else {
        // 鼠标方向（相对于屏幕中心，即玩家）
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        tDx = mouse.x - cx;
        tDy = mouse.y - cy;
        moving = mouse.down;
      }

      player.update(dt, tDx, tDy, moving);

      // AI bots
      bots.forEach(bot => {
        if (!bot.alive) return;
        // 简单 AI：朝最近食物或随机游走
        let target = null;
        let minD = Infinity;
        foods.forEach(f => {
          const d = dist(bot, f);
          if (d < minD) { minD = d; target = f; }
        });
        // 偶尔追玩家（如果自己更大）
        if (bot.mass > player.mass * 1.15 && dist(bot, player) < 400) {
          target = player;
        }
        // 逃离更大的球
        bots.forEach(other => {
          if (other !== bot && other.alive && other.mass > bot.mass * 1.2 && dist(bot, other) < 250) {
            target = { x: bot.x - (other.x - bot.x), y: bot.y - (other.y - bot.y) };
          }
        });
        if (player.mass > bot.mass * 1.2 && dist(bot, player) < 280) {
          target = { x: bot.x - (player.x - bot.x), y: bot.y - (player.y - bot.y) };
        }

        let dx = 0, dy = 0;
        if (target) {
          dx = target.x - bot.x;
          dy = target.y - bot.y;
        } else {
          dx = Math.sin(Date.now() / 800 + bot.x) * 50;
          dy = Math.cos(Date.now() / 900 + bot.y) * 50;
        }
        bot.update(dt, dx, dy, true);
      });

      // 吃食物
      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        if (dist(player, f) < player.r - 2) {
          player.mass += f.mass;
          player.eatTimer = CONFIG.eatAnimDuration;
          foods.splice(i, 1);
          // 补一个
          foods.push({
            x: Math.random() * CONFIG.worldSize,
            y: Math.random() * CONFIG.worldSize,
            mass: CONFIG.foodMass,
            color: `hsl(${Math.random()*360}, 80%, 60%)`
          });
        }
      }
      // bots 吃食物
      bots.forEach(bot => {
        if (!bot.alive) return;
        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          if (dist(bot, f) < bot.r - 2) {
            bot.mass += f.mass;
            foods.splice(i, 1);
            foods.push({
              x: Math.random() * CONFIG.worldSize,
              y: Math.random() * CONFIG.worldSize,
              mass: CONFIG.foodMass,
              color: `hsl(${Math.random()*360}, 80%, 60%)`
            });
          }
        }
      });

      // 球吃球
      const all = [player, ...bots];
      for (let i = 0; i < all.length; i++) {
        for (let j = i + 1; j < all.length; j++) {
          const a = all[i], b = all[j];
          if (!a.alive || !b.alive) continue;
          const d = dist(a, b);
          if (d < Math.max(a.r, b.r) * 0.85) {
            if (a.mass > b.mass * 1.12) {
              a.mass += b.mass * 0.9;
              b.alive = false;
              if (a.isPlayer) a.eatTimer = CONFIG.eatAnimDuration;
            } else if (b.mass > a.mass * 1.12) {
              b.mass += a.mass * 0.9;
              a.alive = false;
              if (b.isPlayer) b.eatTimer = CONFIG.eatAnimDuration;
            }
          }
        }
      }

      // 相机跟随
      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;

      massDisplay.textContent = Math.floor(player.mass);

      // 胜负
      if (player.mass >= CONFIG.winMass) {
        running = false;
        winOverlay.style.display = 'flex';
      }
      if (!player.alive) {
        running = false;
        loseOverlay.style.display = 'flex';
      }
    }

    function draw() {
      ctx.fillStyle = '#0d1b2a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 网格
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      const grid = 80;
      const startX = - (camera.x % grid);
      const startY = - (camera.y % grid);
      for (let x = startX; x < canvas.width; x += grid) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = startY; y < canvas.height; y += grid) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 食物
      foods.forEach(f => {
        const sx = f.x - camera.x;
        const sy = f.y - camera.y;
        if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) return;
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      });

      // bots + player
      bots.forEach(b => b.draw(ctx, camera.x, camera.y));
      if (player) player.draw(ctx, camera.x, camera.y);
    }

    function loop(ts) {
      if (!running) return;
      const dt = Math.min((ts - lastTime) / 1000, 0.05);
      lastTime = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // ============== 启动 / 返回 ==============
    function startGame(level) {
      menu.style.display = 'none';
      gameContainer.style.display = 'block';
      resize();
      initLevel(level);
      running = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function backToMenu() {
      running = false;
      gameContainer.style.display = 'none';
      menu.style.display = 'flex';
      winOverlay.style.display = 'none';
      loseOverlay.style.display = 'none';
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    // ============== 事件绑定 ==============
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('disabled')) return;
        const lv = btn.dataset.level;
        if (lv === '1') startGame(1);
        // 其他关卡后续可扩展
      });
    });

    backBtn.addEventListener('click', backToMenu);
    document.getElementById('next-level-btn').addEventListener('click', backToMenu);
    document.getElementById('retry-btn').addEventListener('click', () => {
      winOverlay.style.display = 'none';
      loseOverlay.style.display = 'none';
      initLevel(1);
      running = true;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    });
    document.getElementById('menu-btn').addEventListener('click', backToMenu);

    window.addEventListener('resize', () => {
      if (running) resize();
    });

    // 初始化
    setupInput();
    loadImages().then(() => {
      console.log('噗伊大作战 资源加载完成');
    });
  </script>
</body>
</html>
